<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fit 2gether</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fit 2gether">
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Compat SDKs (Essential for single-file HTML apps) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
            color: #f1f5f9;
            overflow-x: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-short { animation: bounce-short 2s infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 1s linear infinite; }
        #root:empty { display: flex; align-items: center; justify-center: center; height: 100vh; background: #0f172a; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col items-center justify-center w-full h-screen space-y-4">
            <div class="w-12 h-12 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs font-black uppercase tracking-widest text-slate-500 text-center px-6 italic">Awakening Heroes...</p>
        </div>
    </div>

    <script type="text/babel">
        // --- 1. CONFIG & INITIALIZATION ---
        const appId = 'fit-2gether-prod'; 
        const GOAL_ADVENTURES = 3;
        const PLAYERS = ["Max", "Ashley"];

        const firebaseConfig = {
            apiKey: "AIzaSyD4jzxDM14_Db70ZTLO3c4CIp9UU_CZGvs",
            authDomain: "fit-2gether.firebaseapp.com",
            projectId: "fit-2gether",
            storageBucket: "fit-2gether.firebasestorage.app",
            messagingSenderId: "601749541750",
            appId: "1:601749541750:web:0e8302ab760f9e33512057"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- 2. HELPERS ---
        const getLevel = (exp) => Math.floor((exp || 0) / 1000) + 1;

        const getISOWeekId = (date = new Date()) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getUTCFullYear()}-W${weekNo.toString().padStart(2, '0')}`;
        };

        const getWeekDisplay = () => getISOWeekId().replace('-', ' ');

        const REWARDS_TIERS = [
            { level: 2, title: "Coffee Treat", icon: "coffee", desc: "Partner buys you a coffee! ☕", color: "bg-orange-500" },
            { level: 5, title: "Dessert Date", icon: "ice-cream", desc: "Unlock a sweet treat from partner! 🍰", color: "bg-pink-500" },
            { level: 8, title: "Dinner Treat", icon: "utensils", desc: "Delicious dinner on the partner! 🍔", color: "bg-indigo-500" },
            { level: 10, title: "Ultimate Wish", icon: "sparkles", desc: "Partner grants you one wish! ✨", color: "bg-amber-500" }
        ];

        const compressImage = (file, maxWidth = 500, quality = 0.5) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h && w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
                        else if (h > maxWidth) { w = (w * maxWidth) / h; h = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        };

        // --- 3. UI COMPONENTS ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            React.useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, 50);
                return () => clearTimeout(timer);
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const HeroGuideModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-in fade-in">
                <div className="bg-slate-900 border border-white/10 rounded-[2.5rem] w-full max-w-sm overflow-hidden shadow-2xl text-slate-100 border-2 border-rose-500/20">
                    <div className="p-6 bg-slate-800/50 flex justify-between items-center border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="bg-rose-500 p-2 rounded-xl shadow-lg"><Icon name="help-circle" className="text-white w-4 h-4" /></div>
                            <h3 className="font-black italic uppercase leading-none">Hero Guide</h3>
                        </div>
                        <button onClick={onClose} className="p-2 bg-slate-700 rounded-full text-slate-300"><Icon name="x" className="w-4 h-4" /></button>
                    </div>
                    <div className="p-6 space-y-6 max-h-[65vh] overflow-y-auto custom-scrollbar text-sm">
                        <section className="space-y-2 text-xs leading-relaxed">
                            <h4 className="font-black uppercase text-amber-400 italic flex items-center gap-2"><Icon name="zap" className="w-3 h-3" /> EXP Formula</h4>
                            <div className="bg-white/5 p-4 rounded-3xl border border-white/5 space-y-3">
                                <p className="text-slate-400 font-medium">Minutes = Cardio + Strength Combined</p>
                                <ul className="space-y-1.5">
                                    <li className="flex justify-between font-bold"><span>Per 30 mins</span> <span className="text-rose-400">+100 EXP</span></li>
                                    <li className="flex justify-between font-bold"><span>Every extra 10 mins</span> <span className="text-amber-400">+30 EXP</span></li>
                                </ul>
                            </div>
                        </section>
                        <section className="space-y-2 text-xs">
                            <h4 className="font-black uppercase text-sky-400 italic flex items-center gap-2"><Icon name="star" className="w-3 h-3" /> Rank Thresholds</h4>
                            <div className="bg-white/5 p-4 rounded-3xl border border-white/5 space-y-1 font-medium">
                                <p className="flex justify-between border-b border-white/5 pb-1"><span>Rank 1 (Novice)</span> <span className="text-white">0+ EXP</span></p>
                                <p className="flex justify-between border-b border-white/5 py-1"><span>Rank 2 (Squire)</span> <span className="text-white">1,000+ EXP</span></p>
                                <p className="flex justify-between border-b border-white/5 py-1"><span>Rank 3 (Knight)</span> <span className="text-white">2,000+ EXP</span></p>
                                <p className="text-[10px] text-slate-500 pt-2 text-center italic">+1,000 EXP for every Rank Up</p>
                            </div>
                        </section>
                        <section className="space-y-2 text-xs">
                            <h4 className="font-black uppercase text-indigo-400 italic flex items-center gap-2"><Icon name="clock" className="w-3 h-3" /> Weekly Goal</h4>
                            <div className="bg-white/5 p-4 rounded-3xl border border-white/5 leading-relaxed text-slate-400">
                                <p>Goal progress (0/3) resets every <span className="text-white font-bold">Monday 00:00</span> based on your local time.</p>
                            </div>
                        </section>
                    </div>
                    <div className="p-4 bg-slate-900 border-t border-white/5"><button onClick={onClose} className="w-full bg-rose-600 text-white py-4 rounded-2xl font-black italic uppercase shadow-xl active:scale-95 transition-all">Close Manual</button></div>
                </div>
            </div>
        );

        const QuestDetailModal = ({ quest, onClose }) => {
            if (!quest) return null;
            const cardioTime = quest.cardio?.reduce((a,c)=>a+(parseInt(c.time)||0), 0) || 0;
            const strengthTime = quest.strength?.reduce((a,c)=>a+(parseInt(c.time)||0), 0) || 0;
            const totalTime = cardioTime + strengthTime;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl animate-in fade-in">
                    <div className="bg-slate-900 border border-white/10 rounded-[2.5rem] w-full max-w-sm overflow-hidden shadow-2xl text-slate-100">
                        <div className="p-6 bg-slate-800/50 flex justify-between items-center border-b border-white/5 text-slate-100">
                            <div className="flex items-center gap-3">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-sm shadow-lg ${quest.player === 'Max' ? 'bg-sky-500' : 'bg-rose-500'}`}>{quest.player[0]}</div>
                                <div><h3 className="font-black italic uppercase leading-none">Quest Summary</h3><p className="text-[9px] font-bold text-slate-500 uppercase mt-1">{quest.dateString}</p></div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-700 rounded-full text-slate-300"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <div className="p-6 space-y-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
                            <div className="flex justify-around bg-slate-950 p-5 rounded-3xl border border-white/5 shadow-inner">
                                <div className="text-center"><p className="text-[8px] font-black text-slate-500 uppercase italic">Time Pool</p><p className="text-xl font-black text-white italic">{totalTime}m</p></div>
                                <div className="w-px bg-white/5" /><div className="text-center"><p className="text-[8px] font-black text-slate-500 uppercase italic">EXP Gained</p><p className="text-xl font-black text-amber-400 italic">+{quest.expGained}</p></div>
                            </div>
                            <div className="space-y-4">
                                {quest.cardio?.filter(c => c.time > 0).map((c, i) => (
                                    <div key={i} className="flex justify-between bg-slate-950/80 p-4 rounded-2xl border border-white/5 shadow-sm text-sm font-bold">
                                        <span className="flex items-center gap-2 font-black italic"><Icon name="activity" className="w-3 h-3 text-rose-500" /> {c.type}</span>
                                        <span className="text-rose-400">{c.time}m</span>
                                    </div>
                                ))}
                                {quest.strength?.filter(s => s.time > 0).map((s, i) => (
                                    <div key={i} className="bg-slate-950/80 p-5 rounded-2xl border border-white/5 space-y-2 shadow-sm">
                                        <div className="flex justify-between border-b border-white/5 pb-1 text-sm font-bold">
                                            <span className="flex items-center gap-2 font-black italic"><Icon name="swords" className="w-3 h-3 text-sky-500" /> {s.type}</span>
                                            <span className="text-sky-400">{s.time}m</span>
                                        </div>
                                        <p className="text-[11px] text-slate-400 italic whitespace-pre-wrap leading-relaxed">{s.exercises}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 bg-slate-900"><button onClick={onClose} className="w-full bg-slate-800 text-white py-4 rounded-2xl font-black italic uppercase shadow-xl active:scale-[0.98]">Close</button></div>
                    </div>
                </div>
            );
        };

        const CelebrationModal = ({ type, data, onClose }) => {
            if (!type) return null;
            const content = {
                levelUp: { title: "Level Up!", subtitle: `${data?.player} reached Rank ${data?.level}!`, icon: "star", color: "text-amber-400", bg: "from-amber-500 to-orange-600" },
                goalReached: { title: "Goal Clear!", subtitle: `${data?.player} completed 3/3 adventures!`, icon: "trophy", color: "text-white", bg: "from-emerald-500 to-teal-600" },
                guildClear: { title: "Guild Victory!", subtitle: "Both heroes completed 3/3! Pure teamwork!", icon: "sparkles", color: "text-yellow-200", bg: "from-rose-600 to-indigo-700" }
            };
            const active = content[type];
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md animate-in fade-in">
                    <div className={`bg-gradient-to-br ${active.bg} p-1 rounded-[3rem] shadow-2xl w-full max-w-xs animate-bounce-short`}>
                        <div className="bg-slate-900 rounded-[2.8rem] p-8 text-center space-y-6 text-slate-100">
                            <div className="flex justify-center"><Icon name={active.icon} className={`w-16 h-16 ${active.color}`} /></div>
                            <div className="space-y-2">
                                <h2 className="text-2xl font-black italic uppercase leading-tight">{active.title}</h2>
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">{active.subtitle}</p>
                            </div>
                            <button onClick={onClose} className="w-full bg-white text-slate-900 py-4 rounded-2xl font-black uppercase italic shadow-xl">Continue Journey</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. MAIN APP ---
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [history, setHistory] = useState([]);
            const [viewingQuest, setViewingQuest] = useState(null);
            const [showGuide, setShowGuide] = useState(false);
            const [celebration, setCelebration] = useState({ type: null, data: null });
            const [cheerState, setCheerState] = useState({ questId: null, message: "" });
            const [isSaving, setIsSaving] = useState(false);
            const [isProfileSaving, setIsProfileSaving] = useState(false);
            const [errorMessage, setErrorMessage] = useState("");
            const [currentHero, setCurrentHero] = useState("Max");
            const [showHeroSwitcher, setShowHeroSwitcher] = useState(false);
            
            const [playerData, setPlayerData] = useState({
                Max: { exp: 0, height: 180, age: 28, weight: 80, heartPoints: 0, redeemed: [] },
                Ashley: { exp: 0, height: 165, age: 25, weight: 65, heartPoints: 0, redeemed: [] }
            });
            const [logForm, setLogForm] = useState({ player: "Max", cardio: [{ type: "", time: 0 }], strength: [{ type: "", time: 0, exercises: "" }], battleCry: "", photoUrl: "" });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const credential = await auth.signInAnonymously();
                        setUser(credential.user);
                    } catch (e) { setErrorMessage("Auth link failed. Check Firebase console."); }
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubQuests = path.collection('quests').onSnapshot(snap => {
                    setHistory(snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp));
                    setErrorMessage("");
                }, (err) => setErrorMessage(`Sync Error: ${err.message}`));

                const unsubStats = path.collection('stats').onSnapshot(snap => {
                    const stats = {}; snap.forEach(d => { stats[d.id] = d.data(); });
                    if (Object.keys(stats).length > 0) setPlayerData(prev => ({...prev, ...stats}));
                });

                return () => { unsubQuests(); unsubStats(); };
            }, [user]);

            const updateLocalProfileStat = (player, field, value) => {
                setPlayerData(p => ({ ...p, [player]: { ...p[player], [field]: parseInt(value) || 0 } }));
            };

            const handleSaveProfile = async () => {
                if (!user) return;
                setIsProfileSaving(true);
                try {
                    const statsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('stats');
                    await Promise.all(PLAYERS.map(player => statsRef.doc(player).set(playerData[player], { merge: true })));
                    setErrorMessage("Hero Registry Updated! ✨");
                    setTimeout(() => setErrorMessage(""), 3000);
                } catch(e) { setErrorMessage("Save failed."); }
                finally { setIsProfileSaving(false); }
            };

            const handlePhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setErrorMessage("Optimizing photo...");
                const base64 = await compressImage(file);
                setLogForm({ ...logForm, photoUrl: base64, player: currentHero });
                setErrorMessage("");
            };

            const getWeeklyProgress = (p) => {
                const currentWeekId = getISOWeekId();
                const weekly = history.filter(q => q.player === p && q.weekId === currentWeekId && !q.isReward);
                return Math.min(GOAL_ADVENTURES, weekly.length);
            };

            const handleSaveQuest = async () => {
                if (!user) { setErrorMessage("Connecting..."); return; }
                setIsSaving(true);
                setErrorMessage("");
                const activePlayer = currentHero;
                const cardioTime = logForm.cardio.reduce((a,c) => a + (parseInt(c.time) || 0), 0);
                const strengthTime = logForm.strength.reduce((a,c) => a + (parseInt(c.time) || 0), 0);
                
                // MATH: Total pool minutes calc
                const totalMinutes = cardioTime + strengthTime;
                let turnsForExp = Math.floor(totalMinutes / 30);
                let remainderMinutes = totalMinutes % 30;
                let bonusExp = Math.floor(remainderMinutes / 10) * 30;
                const exp = (turnsForExp * 100) + bonusExp;
                
                const oldExp = playerData[activePlayer]?.exp || 0;
                const oldCount = getWeeklyProgress(activePlayer);
                const currentWeekId = getISOWeekId();

                try {
                    const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    await path.collection('quests').add({ 
                        ...logForm, 
                        player: activePlayer, 
                        expGained: exp, 
                        weekId: currentWeekId, 
                        timestamp: Date.now(), 
                        dateString: new Date().toLocaleDateString() 
                    });
                    await path.collection('stats').doc(activePlayer).set({ exp: oldExp + exp }, { merge: true });
                    
                    if (getLevel(oldExp + exp) > getLevel(oldExp)) setCelebration({ type: 'levelUp', data: { player: activePlayer, level: getLevel(oldExp + exp) } });
                    else if (oldCount < GOAL_ADVENTURES && (oldCount + 1) >= GOAL_ADVENTURES) {
                        const partner = PLAYERS.find(p => p !== activePlayer);
                        if (getWeeklyProgress(partner) >= GOAL_ADVENTURES) setCelebration({ type: 'guildClear', data: {} });
                        else setCelebration({ type: 'goalReached', data: { player: activePlayer } });
                    }
                    setActiveTab('dashboard');
                    setLogForm({ player: currentHero, cardio: [{type:"", time:0}], strength: [{type:"", time:0, exercises:""}], battleCry: "", photoUrl: "" });
                } catch(e) { setErrorMessage("Save Failed: Photo might be too big."); } 
                finally { setIsSaving(false); }
            };

            const handleDeleteQuest = async (quest) => {
                if (!confirm(`Delete record? ${quest.expGained} EXP will be lost.`)) return;
                try {
                    const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    await path.collection('quests').doc(quest.id).delete();
                    const newExp = Math.max(0, (playerData[quest.player]?.exp || 0) - (quest.expGained || 0));
                    await path.collection('stats').doc(quest.player).set({ exp: newExp }, { merge: true });
                } catch (e) { setErrorMessage("Delete failed."); }
            };

            const claimReward = async (tier) => {
                const redeemed = playerData[currentHero]?.redeemed || [];
                if (redeemed.includes(tier.level)) return;
                try {
                    const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    await path.collection('stats').doc(currentHero).set({ redeemed: [...redeemed, tier.level] }, { merge: true });
                    await path.collection('quests').add({
                        player: currentHero,
                        battleCry: `Redeemed Reward: ${tier.title}! 🎁`,
                        expGained: 0,
                        timestamp: Date.now(),
                        dateString: new Date().toLocaleDateString(),
                        isReward: true
                    });
                    setErrorMessage("Reward Claimed! ✨");
                    setTimeout(() => setErrorMessage(""), 3000);
                } catch (e) { setErrorMessage("Claim failed."); }
            };

            const sendCheer = async (questId) => {
                if (!cheerState.message.trim() || !questId) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('quests').doc(questId).update({
                        comments: firebase.firestore.FieldValue.arrayUnion({ from: currentHero, text: cheerState.message, timestamp: Date.now() })
                    });
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('stats').doc(currentHero).set({
                        heartPoints: (playerData[currentHero]?.heartPoints || 0) + 10
                    }, { merge: true });
                    setCheerState({ questId: null, message: "" });
                } catch(e) { setErrorMessage("Cheer failed."); }
            };

            return (
                <div className="min-h-screen pb-24 text-slate-100 overflow-x-hidden bg-[#0f172a] font-sans selection:bg-rose-500/30">
                    <QuestDetailModal quest={viewingQuest} onClose={() => setViewingQuest(null)} />
                    <CelebrationModal type={celebration.type} data={celebration.data} onClose={() => setCelebration({ type: null, data: null })} />
                    {showGuide && <HeroGuideModal onClose={() => setShowGuide(false)} />}

                    <header className="p-4 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 flex justify-between items-center border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-rose-500 to-orange-500 p-2 rounded-xl shadow-lg shadow-rose-900/40"><Icon name="flame" className="text-white w-5 h-5" /></div>
                            <div><h1 className="font-black italic uppercase tracking-tighter text-white text-xl leading-none">Fit 2gether</h1><div className="flex items-center gap-1 mt-1"><Icon name="calendar" className="w-3 h-3 text-amber-400" /><span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest leading-none">{getWeekDisplay()}</span></div></div>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <button onClick={() => setShowGuide(true)} className="p-2 bg-slate-800 rounded-xl border border-white/10 text-slate-400 active:scale-90 transition-all shadow-lg">
                                <Icon name="help-circle" className="w-4 h-4" />
                            </button>
                            <div className="relative">
                                <button onClick={() => setShowHeroSwitcher(!showHeroSwitcher)} className="bg-slate-800 px-4 py-2 rounded-2xl border border-white/10 flex items-center gap-2 shadow-lg active:scale-95 transition-all">
                                    <div className={`w-2 h-2 rounded-full ${currentHero === 'Max' ? 'bg-sky-500 shadow-[0_0_8px_#0ea5e9]' : 'bg-rose-500 shadow-[0_0_8px_#f43f5e]'}`} />
                                    <span className="text-xs font-black uppercase italic tracking-widest leading-none">{currentHero}</span>
                                    <Icon name="chevron-down" className="w-3 h-3 text-slate-500" />
                                </button>
                                {showHeroSwitcher && (
                                    <div className="absolute right-0 mt-2 w-32 bg-slate-800 border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50 animate-in slide-in-from-top-2">
                                        {PLAYERS.map(p => (
                                            <button key={p} onClick={() => { setCurrentHero(p); setShowHeroSwitcher(false); setLogForm({...logForm, player: p}); }} className="w-full p-4 text-left text-[10px] font-black uppercase tracking-widest hover:bg-white/5 border-b border-white/5 last:border-0">{p}</button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6">
                        {errorMessage && <div className="bg-emerald-500/20 border border-emerald-500/40 p-4 rounded-3xl text-emerald-300 text-[10px] font-bold uppercase tracking-widest text-center animate-in slide-in-from-top-2 leading-relaxed">{errorMessage}</div>}

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-in slide-in-from-left-4">
                                <div className="grid grid-cols-2 gap-3">
                                    {PLAYERS.map(name => (
                                        <div key={name} className="bg-slate-900 border border-white/5 p-4 rounded-[2rem] relative overflow-hidden shadow-xl">
                                            <div className={`absolute inset-0 opacity-10 bg-gradient-to-br ${name === 'Max' ? 'from-sky-500' : 'from-rose-500'} to-transparent`} />
                                            <div className="relative z-10 space-y-3">
                                                <div className="flex justify-between items-center"><span className="text-[9px] font-black uppercase px-2 py-0.5 rounded-full border border-white/10 italic leading-none">Rank {getLevel(playerData[name]?.exp)}</span>{name === 'Max' ? <Icon name="shield" className="w-4 h-4 text-sky-500" /> : <Icon name="swords" className="w-4 h-4 text-rose-500" />}</div>
                                                <h2 className="text-lg font-black italic uppercase truncate">{name}</h2>
                                                <div className="space-y-1">
                                                    <div className="flex justify-between text-[10px] font-bold uppercase text-slate-500"><span>Progress</span><span>{getWeeklyProgress(name)}/{GOAL_ADVENTURES}</span></div>
                                                    <div className="h-2 bg-white/5 rounded-full overflow-hidden shadow-inner"><div className={`h-full transition-all duration-1000 ${name === 'Max' ? 'bg-sky-500' : 'bg-rose-500'}`} style={{ width: `${(getWeeklyProgress(name)/GOAL_ADVENTURES)*100}%` }} /></div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-5">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 px-2 flex items-center gap-2 italic leading-none"><Icon name="map" className="w-3 h-3" /> Live Adventures</h3>
                                    {history.map(quest => (
                                        <div key={quest.id} className={`bg-slate-900 border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl relative ${quest.isReward ? 'ring-2 ring-amber-500/50 shadow-amber-900/20' : ''}`}>
                                            <div className="p-5 flex items-center justify-between text-slate-200">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white font-black text-xs shadow-inner ${quest.player === 'Max' ? 'bg-sky-600' : 'bg-rose-600'}`}>{quest.player[0]}</div>
                                                    <div><p className="font-black italic uppercase leading-none">{quest.player}</p><p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1 italic leading-none">{quest.dateString}</p></div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {quest.expGained > 0 && <div className="bg-amber-500/10 px-3 py-1.5 rounded-full border border-amber-500/20 text-amber-400 text-[10px] font-black italic shadow-sm leading-none">+{quest.expGained} EXP</div>}
                                                    <button onClick={() => handleDeleteQuest(quest)} className="p-2 bg-slate-800 rounded-full text-slate-500 hover:text-rose-500 transition-colors"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                                                </div>
                                            </div>
                                            
                                            {quest.isReward ? (
                                                <div className="p-10 text-center bg-gradient-to-br from-amber-500/10 to-transparent">
                                                    <Icon name="gift" className="w-12 h-12 text-amber-500 mx-auto mb-4 animate-bounce" />
                                                    <p className="text-sm font-black italic uppercase text-amber-400 leading-tight">{quest.battleCry}</p>
                                                </div>
                                            ) : (
                                                <div className="aspect-[4/3] bg-slate-950 relative overflow-hidden active:opacity-90 transition-all cursor-pointer" onClick={() => setViewingQuest(quest)}>
                                                    {quest.photoUrl ? <img src={quest.photoUrl} className="w-full h-full object-cover" alt="Session" /> : <div className="w-full h-full flex flex-col items-center justify-center text-slate-800 space-y-2 opacity-20"><Icon name="camera" className="w-12 h-12" /><p className="text-[9px] font-black uppercase tracking-widest leading-none italic">Verified Session</p></div>}
                                                    <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 to-transparent p-6"><p className="text-sm italic font-medium text-white pr-4 line-clamp-2">"{quest.battleCry || "Quest complete."}"</p></div>
                                                </div>
                                            )}

                                            <div className="p-5 space-y-4 bg-slate-900/50">
                                                <div className="space-y-2">
                                                    {quest.comments?.map((c, i) => (
                                                        <div key={i} className="bg-white/5 p-4 rounded-3xl border border-white/5 shadow-sm animate-in fade-in">
                                                            <p className="text-[10px] font-black uppercase text-amber-400 mb-1 italic leading-none">{c.from} Cheers:</p>
                                                            <p className="text-xs italic text-slate-300 font-medium leading-relaxed mt-1">"{c.text}"</p>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={() => setCheerState({...cheerState, questId: quest.id === cheerState.questId ? null : quest.id})} className="w-full bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-widest text-rose-400 transition-all active:scale-[0.98] shadow-sm leading-none">
                                                    <Icon name="message-circle" className="w-4 h-4" /> Send Cheer
                                                </button>
                                                {cheerState.questId === quest.id && (
                                                    <div className="mt-4 p-4 bg-slate-950/50 rounded-3xl border border-white/5 space-y-3 shadow-inner animate-in slide-in-from-top-2">
                                                        <div className="flex gap-2">
                                                            <input value={cheerState.message} onChange={(e) => setCheerState({...cheerState, message: e.target.value})} placeholder="Heroic words..." className="flex-1 bg-slate-950 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-rose-500 text-white font-medium shadow-inner" onKeyDown={(e) => e.key === 'Enter' && sendCheer(quest.id)}/>
                                                            <button onClick={() => sendCheer(quest.id)} className="bg-rose-500 p-4 rounded-2xl shadow-xl active:scale-90 transition-transform"><Icon name="send" className="w-4 h-4 text-white" /></button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'treasury' && (
                            <div className="space-y-6 animate-in slide-in-from-right-4 text-slate-100">
                                <div className="px-2">
                                    <h2 className="text-2xl font-black italic uppercase tracking-tighter leading-none font-black italic">Hero Treasury</h2>
                                    <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-2 italic leading-none">Claim rewards as you level up!</p>
                                </div>
                                <div className="space-y-4">
                                    {REWARDS_TIERS.map((tier, i) => {
                                        const playerLevel = getLevel(playerData[currentHero]?.exp);
                                        const isUnlocked = playerLevel >= tier.level;
                                        const isClaimed = (playerData[currentHero]?.redeemed || []).includes(tier.level);
                                        return (
                                            <div key={i} className={`p-6 rounded-[2.5rem] border ${isUnlocked ? 'bg-slate-900 border-white/10' : 'bg-slate-950 border-white/5 opacity-50'} relative overflow-hidden transition-all shadow-xl`}>
                                                <div className="flex justify-between items-center relative z-10">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`${tier.color} p-3 rounded-2xl shadow-lg shadow-black/20`}><Icon name={tier.icon} className="w-6 h-6 text-white" /></div>
                                                        <div><h3 className="font-black italic uppercase text-sm tracking-tight">{tier.title}</h3><p className="text-[10px] font-medium text-slate-400">{tier.desc}</p></div>
                                                    </div>
                                                    <div className="text-right">
                                                        {isClaimed ? <span className="bg-emerald-500/20 text-emerald-400 text-[8px] font-black uppercase px-3 py-1 rounded-full border border-emerald-500/30 italic">Redeemed</span> : 
                                                         isUnlocked ? <button onClick={() => claimReward(tier)} className="bg-white text-slate-900 text-[8px] font-black uppercase px-4 py-2 rounded-xl shadow-xl active:scale-95 transition-all">Claim</button> :
                                                         <span className="text-[8px] font-black uppercase text-slate-600 italic leading-none">Rank {tier.level}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'log' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-white/5 shadow-2xl space-y-8 animate-in slide-in-from-bottom-5 text-slate-100">
                                <div className="flex justify-between items-center"><div><h2 className="text-2xl font-black italic uppercase tracking-tighter leading-none text-3xl font-black italic">Log Entry</h2><p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2 italic leading-none font-bold underline">Identity: {currentHero}</p></div><button onClick={() => setActiveTab('dashboard')} className="p-2 bg-slate-800 rounded-full text-slate-400"><Icon name="x" className="w-5 h-5" /></button></div>
                                <div className="space-y-6 text-slate-300">
                                    <div className="space-y-3"><label className="text-[10px] font-black uppercase text-amber-500 flex items-center gap-2 italic tracking-widest leading-none"><Icon name="camera" className="w-3 h-3" /> Photo Proof</label>
                                    <label className="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-[2.5rem] cursor-pointer bg-slate-950 border-white/10 relative overflow-hidden shadow-inner">{logForm.photoUrl ? <img src={logForm.photoUrl} className="w-full h-full object-cover" /> : <div className="text-center text-slate-600 opacity-30"><Icon name="image" className="w-10 h-10 mb-3 mx-auto" /><p className="text-[10px] font-black uppercase tracking-widest leading-none italic">Select Photo</p></div>}<input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} /></label></div>
                                    <div className="space-y-3"><label className="text-[10px] font-black uppercase text-indigo-400 flex items-center gap-2 italic tracking-widest leading-none"><Icon name="scroll" className="w-3 h-3" /> Battle Cry</label><input placeholder="Legendary session today! 💪🔥" className="w-full bg-slate-950 border border-white/10 p-4 rounded-2xl text-sm outline-none text-white shadow-inner focus:border-indigo-500/50 font-medium" value={logForm.battleCry} onChange={e => setLogForm({...logForm, battleCry: e.target.value})} /></div>
                                    <div className="space-y-6 text-slate-100 font-bold">
                                        <div className="space-y-4"><div className="flex justify-between items-center px-1 pt-2"><label className="text-[10px] font-black uppercase text-rose-500 flex items-center gap-2 italic tracking-widest leading-none"><Icon name="activity" className="w-3 h-3" /> Cardio</label><button onClick={() => setLogForm({...logForm, cardio: [...logForm.cardio, {type:"", time:0}]})} className="bg-rose-500 p-1 rounded-lg text-white shadow-lg"><Icon name="plus-circle" className="w-5 h-5" /></button></div>
                                        {logForm.cardio.map((c, i) => (<div key={i} className="flex gap-3 items-center"><input placeholder="e.g. Running" className="flex-1 bg-slate-950 border border-white/10 p-4 rounded-2xl text-sm text-white shadow-inner" value={c.type} onChange={e=>{const nl=[...logForm.cardio]; nl[i].type=e.target.value; setLogForm({...logForm, cardio: nl})}} /><input type="number" placeholder="Min" className="w-20 bg-slate-950 border border-white/10 p-4 rounded-2xl text-sm text-center text-white shadow-inner font-bold" value={c.time||""} onChange={e=>{const nl=[...logForm.cardio]; nl[i].time=e.target.value; setLogForm({...logForm, cardio: nl})}} /></div>))}</div>
                                        <div className="space-y-4"><div className="flex justify-between items-center px-1 pt-2"><label className="text-[10px] font-black uppercase text-blue-500 flex items-center gap-2 italic tracking-widest leading-none"><Icon name="swords" className="w-3 h-3" /> Strength</label><button onClick={() => setLogForm({...logForm, strength: [...logForm.strength, {type:"", time:0, exercises:""}]})} className="bg-blue-500 p-1 rounded-lg text-white shadow-lg"><Icon name="plus-circle" className="w-5 h-5" /></button></div>
                                        {logForm.strength.map((s, i) => (
                                            <div key={i} className="bg-slate-950 border border-white/10 p-6 rounded-[2.5rem] space-y-4 shadow-inner relative text-slate-200">
                                                {logForm.strength.length > 1 && (<button onClick={() => {const nl=[...logForm.strength]; nl.splice(i, 1); setLogForm({...logForm, strength: nl})}} className="absolute top-5 right-5 text-slate-700 hover:text-rose-500 transition-colors p-1"><Icon name="trash-2" className="w-5 h-5" /></button>)}
                                                <div className="flex gap-4"><input placeholder="부위" className="flex-1 bg-slate-900/50 p-4 rounded-2xl text-xs text-white font-bold" value={s.type} onChange={e=>{const nl=[...logForm.strength]; nl[i].type=e.target.value; setLogForm({...logForm, strength: nl})}} /><input type="number" placeholder="Min" className="w-20 bg-slate-900/50 p-4 rounded-2xl text-xs text-center font-bold text-white shadow-sm" value={s.time||""} onChange={e=>{const nl=[...logForm.strength]; nl[i].time=e.target.value; setLogForm({...logForm, strength: nl})}} /></div>
                                                <textarea placeholder="상세 루틴..." className="w-full bg-slate-900/50 p-4 rounded-2xl text-[11px] h-24 outline-none text-slate-300 shadow-inner placeholder:text-slate-800/50 leading-relaxed font-medium" value={s.exercises} onChange={e=>{const nl=[...logForm.strength]; nl[i].exercises=e.target.value; setLogForm({...logForm, strength: nl})}} />
                                            </div>
                                        ))}</div>
                                    </div>
                                    <button onClick={handleSaveQuest} disabled={isSaving} className={`w-full bg-gradient-to-r from-rose-600 to-orange-600 text-white py-6 rounded-[2.5rem] font-black italic uppercase tracking-widest shadow-2xl active:scale-[0.97] transition-all text-sm flex items-center justify-center gap-3 ${isSaving ? 'opacity-70' : 'shadow-rose-900/30'}`}>
                                        {isSaving ? <Icon name="loader" className="w-5 h-5 animate-spin-fast" /> : <Icon name="check-circle" className="w-5 h-5" />}
                                        {isSaving ? 'Sealing...' : 'Seal Adventure'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'hall' && (
                            <div className="space-y-6 animate-in slide-in-from-right-4">
                                <h2 className="text-2xl font-black italic uppercase text-white tracking-tight px-2 font-black italic leading-none italic leading-none italic">Hall of Heroes</h2>
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-white/5 shadow-2xl text-slate-100">
                                    <div className="grid grid-cols-2 gap-4">
                                        {PLAYERS.map(n => (<div key={n} className="bg-slate-950/50 p-6 rounded-[2rem] border border-white/5 text-center shadow-inner"><p className="text-[10px] font-black uppercase text-slate-500 mb-1 tracking-widest leading-none italic leading-none">Rank {getLevel(playerData[n]?.exp)}</p><p className="text-3xl font-black italic text-white leading-none tracking-tighter">{playerData[n]?.exp || 0}</p><p className="text-[8px] font-bold text-amber-500/60 uppercase mt-2 tracking-widest italic leading-none">Total EXP</p></div>))}
                                    </div>
                                    <div className="pt-8 border-t border-white/5 space-y-8 text-center">
                                        <div className="flex items-center justify-between px-2 text-slate-500"><h4 className="text-[10px] font-black uppercase flex items-center gap-1.5 italic tracking-widest leading-none italic leading-none"><Icon name="bar-chart-3" className="w-3 h-3" /> Training Volume</h4></div>
                                        <div className="flex gap-4">
                                            {PLAYERS.map(p => (
                                                <div key={p} className="flex-1 p-4 bg-slate-900/40 rounded-3xl border border-white/5 text-center shadow-inner">
                                                    <p className="text-[10px] font-black uppercase mb-3 text-slate-400 italic leading-none">{p}</p>
                                                    <div className="text-3xl font-black italic text-sky-400 leading-none">{getWeeklyProgress(p)}/3</div>
                                                    <p className="text-[8px] text-slate-600 font-bold uppercase mt-2 tracking-widest leading-none">Complete</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="space-y-4 animate-in slide-in-from-right-4">
                                <h2 className="text-2xl font-black italic uppercase text-white tracking-tight px-2 font-black italic leading-none leading-none">Hero Hub</h2>
                                <div className="bg-slate-900 rounded-[2.5rem] p-6 border border-white/5 space-y-6 shadow-2xl">
                                    {PLAYERS.map(n => (
                                        <div key={n} className="space-y-3 p-5 bg-slate-950 rounded-[2rem] border border-white/5 shadow-inner text-slate-100">
                                            <div className="flex items-center justify-between">
                                                <p className="font-black italic uppercase text-slate-300 tracking-widest leading-none">{n}</p>
                                                <div className="flex gap-0.5">{[...Array(3)].map((_,i) => <Icon key={i} name="star" className={`w-3.5 h-3.5 ${getLevel(playerData[n]?.exp) > i*5 ? 'text-amber-400 fill-amber-400' : 'text-slate-800'}`} />)}</div>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div className="space-y-1 text-slate-100"><label className="text-[7px] font-black text-slate-600 uppercase tracking-widest leading-none italic">나이</label><input type="number" value={playerData[n]?.age || ""} onChange={(e) => updateLocalProfileStat(n, 'age', e.target.value)} className="w-full bg-slate-900 p-2.5 rounded-xl border border-white/5 text-xs font-bold text-white outline-none focus:border-white/10 shadow-inner" /></div>
                                                <div className="space-y-1 text-slate-100"><label className="text-[7px] font-black text-slate-600 uppercase tracking-widest leading-none italic">키 (cm)</label><input type="number" value={playerData[n]?.height || ""} onChange={(e) => updateLocalProfileStat(n, 'height', e.target.value)} className="w-full bg-slate-900 p-2.5 rounded-xl border border-white/5 text-xs font-bold text-white outline-none focus:border-white/10 shadow-inner" /></div>
                                                <div className="space-y-1 text-slate-100"><label className="text-[7px] font-black text-slate-600 uppercase tracking-widest leading-none italic">몸무게 (kg)</label><input type="number" value={playerData[n]?.weight || ""} onChange={(e) => updateLocalProfileStat(n, 'weight', e.target.value)} className="w-full bg-slate-900 p-2.5 rounded-xl border border-white/5 text-xs font-bold text-white outline-none focus:border-white/10 shadow-inner" /></div>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={handleSaveProfile} disabled={isProfileSaving} className={`w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-2xl font-black italic uppercase tracking-widest text-xs flex items-center justify-center gap-3 transition-all active:scale-95 shadow-xl shadow-indigo-900/20 ${isProfileSaving ? 'opacity-50' : ''}`}>
                                        {isProfileSaving ? <Icon name="loader" className="w-4 h-4 animate-spin-fast" /> : <Icon name="save" className="w-4 h-4" />}
                                        {isProfileSaving ? 'Saving...' : 'Save Hero Stats'}
                                    </button>
                                </div>
                                <div className="bg-slate-900 rounded-[2.5rem] p-6 border border-white/5 shadow-2xl space-y-2 text-center text-slate-500">
                                    <p className="text-[9px] leading-relaxed italic uppercase font-black tracking-widest leading-tight">Folder: <b>{appId}</b><br/>Local Week: <b>{getISOWeekId()}</b></p>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-3xl border-t border-white/5 p-3 flex justify-around items-center max-w-md mx-auto z-40 shadow-2xl text-slate-400">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'text-rose-500 bg-rose-500/10' : ''}`}><Icon name="map" className="w-6 h-6" /><span className="text-[9px] font-black uppercase mt-1 italic tracking-widest leading-none font-bold">Map</span></button>
                        <button onClick={() => setActiveTab('treasury')} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${activeTab === 'treasury' ? 'text-amber-500 bg-amber-500/10' : ''}`}><Icon name="gift" className="w-6 h-6" /><span className="text-[9px] font-black uppercase mt-1 italic tracking-widest leading-none font-bold">Vault</span></button>
                        <button onClick={() => setActiveTab('log')} className="bg-gradient-to-tr from-rose-500 to-orange-600 text-white p-5 rounded-full -mt-12 shadow-2xl shadow-rose-900/40 active:scale-90 transition-transform ring-8 ring-[#0f172a]"><Icon name="plus" className="w-7 h-7" /></button>
                        <button onClick={() => setActiveTab('hall')} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${activeTab === 'hall' ? 'text-emerald-500 bg-emerald-500/10' : ''}`}><Icon name="trophy" className="w-6 h-6" /><span className="text-[9px] font-black uppercase mt-1 italic tracking-widest leading-none font-bold">Hall</span></button>
                        <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${activeTab === 'profile' ? 'text-indigo-500 bg-indigo-500/10' : ''}`}><Icon name="user" className="w-6 h-6" /><span className="text-[9px] font-black uppercase mt-1 italic tracking-widest leading-none font-bold">Hero</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
